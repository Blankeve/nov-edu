#logging:
#  config: classpath:logback-spring.mapping
#  config: classpath:properties/log4j2.mapping
#  config: classpath:properties/log4j.properties

mybatis-plus:
  mapper-locations: classpath*:/mapping/*.xml
  global-config:
    db-config:
      logic-delete-field: isDeleted  # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  type-aliases-package: com.novedu.nov.statistics.entity
  configuration:
    map-underscore-to-camel-case: true     #讲结果集由下划线转为驼峰映射实体类的字段，不用自己做映射
#  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.log4j2   #Log4j2Impl:这个不在控制台打印查询结果,但是在log4j中打印
server:
  port: 8087

feign:
  client:
    config:
      default:
        ConnectTimeOut: 10000
        ReadTimeOut: 10000
  hystrix:
    enabled: true
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 5000  #熔断超时时间

ribbon:
  ReadTimeout: 60000  #请求处理的超时时间
  ConnectTimeout: 60000 #请求连接超时时间
  MaxAutoRetries: 0 #对当前实例的重试次数
  MaxAutoRetriesNextServer: 1 #切换实例的重试次数 1
