server:
  port: 8100
spring:
  application:
    name: nov-gateway
  cache:
    type: redis
  redis:
    host: 106.13.225.159
    port: 6379
    jedis:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 500
        min-idle: 0
    timeout: 5000
    password: ju2009jedis
    database: 0     #Redis提供了 16 个索引库，但是每个数据库之间是隔离互不共享的，客户端默认连接使用的是 0 号数据库
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowCredentials: true
            allowedHeaders: '*'
            allowedMethods: '*'
            allowedOrigins: '*'
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true #使用小写service-id
      routes: #配置路由路径
        - id: nov-auth
          uri: lb://nov-auth
          predicates:
            - Path=/auth/**
          filters:
            - RemoveRequestHeader=Expect

        - id: service-edu
          uri: lb://service-edu
          predicates:
            - Path=/edu/**
          filters:
            - RemoveRequestHeader=Expect

        - id: service-ucenter
          uri: lb://service-ucenter
          predicates:
            - Path=/ucenter/**
          filters:
            - RemoveRequestHeader=Expect

        - id: service-order
          uri: lb://service-order
          predicates:
            - Path=/order/**
          filters:
            - RemoveRequestHeader=Expect

        - id: service-statistics
          uri: lb://service-statistics
          predicates:
            - Path=/statistics/**
          filters:
            - RemoveRequestHeader=Expect

        - id: service-upload
          uri: lb://service-upload
          predicates:
            - Path=/upload/**
          filters:
            - RemoveRequestHeader=Expect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 'http://localhost:8101/auth/rsa/publicKey' #配置RSA的公钥访问地址
feign:
  client:
    config:
      default:
        ConnectTimeOut: 10000
        ReadTimeOut: 10000
  hystrix:
    enabled: true
hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 5000  #熔断超时时间

ribbon:
  ReadTimeout: 60000  #请求处理的超时时间
  ConnectTimeout: 60000 #请求连接超时时间
  MaxAutoRetries: 0 #对当前实例的重试次数
  MaxAutoRetriesNextServer: 1 #切换实例的重试次数 1


